# Cauris : documentation développeur de SecureFinBridge.
# Même espace de noms que la passerelle (securefinbridge), créé par le pipeline s'il n'existe pas.
# Même recette d'Ingress que Les Meilleurs : Traefik + cert-manager (letsencrypt-prod).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cauris-docs
  namespace: securefinbridge
  labels: { app: cauris-docs }
spec:
  replicas: 1
  selector:
    matchLabels: { app: cauris-docs }
  template:
    metadata:
      labels: { app: cauris-docs }
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: cauris-docs
          # Valeur de départ : le pipeline fixe l'étiquette exacte avec `kubectl set image`.
          image: ghcr.io/securefinbridge/cauris-docs:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /sante, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /sante, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 96Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: cauris-docs
  namespace: securefinbridge
spec:
  type: ClusterIP
  selector: { app: cauris-docs }
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: docs-redirect-https
  namespace: securefinbridge
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cauris-docs
  namespace: securefinbridge
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: securefinbridge-docs-redirect-https@kubernetescrd
spec:
  tls:
    - hosts: [docs.securefinbridge.emmanuelsehou.com]
      secretName: cauris-docs-tls
  rules:
    - host: docs.securefinbridge.emmanuelsehou.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cauris-docs
                port: { number: 80 }
