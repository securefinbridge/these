# Démonstrateur SecureFinBridge : construit l'image et déploie la passerelle de démonstration.
# Portage du modèle GitLab de Les Meilleurs : image, kubectl apply, set image, rollout, vérification,
# diagnostic en cas d'échec. Mêmes étapes et même secret que documentation.yml.
name: Démonstrateur (passerelle SFB-AKA)

on:
  push:
    branches: [prod]
    paths:
      - 'code/banc/**'
      - 'code/bouchon_cbs.py'
      - 'deploiement/**'
      - '.github/workflows/deploiement.yml'
  workflow_dispatch:

concurrency:
  group: deploiement-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/securefinbridge/passerelle-demo
  NS: securefinbridge
  URL: https://securefinbridge.emmanuelsehou.com

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: code
          file: code/banc/Dockerfile.demo
          push: true
          build-args: |
            COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=SecureFinBridge - prototype de démonstration (banque simulée et clés jetables)
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://securefinbridge.emmanuelsehou.com
    env:
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Accès au cluster
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          echo "Branche $GITHUB_REF_NAME, commit ${GITHUB_SHA::7}, espace de noms $NS, image $IMAGE:$TAG"
          test -n "$KUBECONFIG_B64" || { echo "::error::Secret KUBECONFIG_B64 absent (Settings > Secrets and variables > Actions)."; exit 1; }
          mkdir -p ~/.kube
          echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config || { echo "::error::KUBECONFIG_B64 n'est pas un base64 valide (coller la sortie de 'base64 -w0' sur une seule ligne)."; exit 1; }
          chmod 600 ~/.kube/config
          # Seules l'adresse du serveur et la date d'expiration du certificat sont affichées, jamais leur contenu.
          echo "Serveur API : $(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')"
          CERT=$(kubectl config view --raw --minify -o jsonpath='{.users[0].user.client-certificate-data}' 2>/dev/null || true)
          if [ -n "$CERT" ]; then
            echo "Certificat client : $(echo "$CERT" | base64 -d | openssl x509 -noout -enddate 2>/dev/null || echo 'illisible')"
            echo "$CERT" | base64 -d | openssl x509 -noout -checkend 2592000 >/dev/null 2>&1 \
              || echo "::warning::Certificat k3s expiré ou expirant sous 30 jours : régénérer KUBECONFIG_B64 depuis le VPS (voir deploiement/DEPLOIEMENT.md)."
          fi
          kubectl cluster-info --request-timeout=20s >/dev/null || { echo "::error::Cluster injoignable depuis GitHub (port 6443 fermé ou certificat expiré). Voir deploiement/DEPLOIEMENT.md, déploiement à la main."; exit 1; }
          echo "Cluster joignable."

      # Le paquet GHCR doit être public pour que le cluster tire l'image sans authentification.
      # Tant qu'il est privé, un secret de tirage provisoire permet au déploiement d'aboutir, mais
      # son jeton expire à la fin de cette tâche : l'image reste en cache sur le nœud, pas au-delà.
      - name: Accès à l'image
        env:
          JETON: ${{ secrets.GITHUB_TOKEN }}
          ACTEUR: ${{ github.actor }}
        run: |
          kubectl apply -f deploiement/k8s/00-namespace.yaml
          DEPOT="${IMAGE#ghcr.io/}"
          anonyme=$(curl -fsS "https://ghcr.io/token?scope=repository:${DEPOT}:pull" | jq -r '.token // empty' || true)
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${anonyme}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json' \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
            -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
            -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/${DEPOT}/manifests/${TAG}" || true)
          if [ "$code" = "200" ]; then
            echo "Paquet public : l'image se tire sans authentification."
            kubectl delete secret ghcr-tirage -n "$NS" --ignore-not-found
          else
            echo "::warning::Le paquet ${IMAGE} est privé (HTTP $code sans authentification). Rendez-le public : https://github.com/${GITHUB_REPOSITORY_OWNER}?tab=packages > passerelle-demo > Package settings > Change visibility. En attendant, un secret de tirage provisoire est créé."
            kubectl create secret docker-registry ghcr-tirage \
              --docker-server=ghcr.io --docker-username="$ACTEUR" --docker-password="$JETON" \
              -n "$NS" --dry-run=client -o yaml | kubectl apply -f -
          fi

      - name: Déploiement
        run: |
          kubectl apply -f deploiement/k8s/
          kubectl set image deployment/sfb-demo sfb-demo="$IMAGE:$TAG" -n "$NS"
          kubectl rollout status deployment/sfb-demo -n "$NS" --timeout=300s
          echo "Image en service : $(kubectl get deployment/sfb-demo -n "$NS" -o jsonpath='{.spec.template.spec.containers[0].image}')"
          kubectl get pods,ingress -n "$NS" -l app=sfb-demo -o wide || true

      - name: Vérification en ligne
        run: |
          # Au premier déploiement, le certificat Let's Encrypt peut demander une à deux minutes.
          for i in $(seq 1 18); do
            code=$(curl -s -o /tmp/sante.json -w '%{http_code}' --max-time 20 "$URL/sante" || true)
            echo "Tentative $i : $URL/sante -> HTTP $code $(head -c 120 /tmp/sante.json 2>/dev/null || true)"
            if [ "$code" = "200" ]; then
              servi=$(curl -s --max-time 20 "$URL/api/v1/etat" | jq -r '.commit // empty' || true)
              echo "Commit en service : ${servi:-inconnu} (attendu : $GITHUB_SHA)"
              [ "$servi" = "$GITHUB_SHA" ] || echo "::warning::Le commit servi n'est pas celui de ce pipeline."
              echo "En ligne : $URL"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$URL/sante ne répond pas 200 après 3 minutes (DNS, certificat ou pod : voir le diagnostic)."
          exit 1

      - name: Diagnostic en cas d'échec
        if: failure()
        run: |
          test -s ~/.kube/config || { echo "Pas d'accès au cluster : aucun diagnostic possible."; exit 0; }
          kubectl get deploy,rs,pods -n "$NS" -o wide || true
          echo "--- Derniers événements ---"
          kubectl get events -n "$NS" --sort-by=.lastTimestamp | tail -n 25 || true
          echo "--- Déploiement ---"
          kubectl describe deployment/sfb-demo -n "$NS" | tail -n 25 || true
          echo "--- Ingress et certificat ---"
          kubectl get ingress,certificate -n "$NS" -o wide || true
          for p in $(kubectl get pods -n "$NS" -l app=sfb-demo -o name 2>/dev/null); do
            echo "--- Logs $p (80 dernières lignes) ---"
            kubectl logs -n "$NS" "$p" --tail=80 2>&1 || true
            if kubectl logs -n "$NS" "$p" --previous --tail=40 > /tmp/precedent.log 2>/dev/null; then
              echo "--- Logs du conteneur précédent (redémarrage) ---"; cat /tmp/precedent.log
            fi
          done

      - name: Effacement du kubeconfig
        if: always()
        run: rm -f ~/.kube/config
