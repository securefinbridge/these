# Démonstrateur SecureFinBridge (Spring Boot). Tout est surchargeable en ligne de commande,
# par exemple :  mvn spring-boot:run -Dspring-boot.run.arguments="--sfb.port=7100"
spring.application.name=securefinbridge-demo
server.port=8080

# Port SFB-AKA de la passerelle (TCP). Sur macOS, le port 7000 est souvent pris par le
# récepteur AirPlay : s'il est occupé, le démonstrateur prend le port libre suivant et le dit.
sfb.port=7000
# Port de la référence TLS 1.3 de la passerelle
sfb.tls-port=7443
# Port du bouchon core banking ISO 20022 (HTTP, local uniquement)
sfb.bouchon-port=8443

# Dossier de travail : clés de démonstration (régénérées à chaque démarrage) et journal d'audit
sfb.dossier=${java.io.tmpdir}/sfb-demo
# Commit de l'image, affiché par /api/v1/etat (variable SFB_COMMIT posée à la construction de l'image)
sfb.commit=${SFB_COMMIT:local}
# Étiquettes de rôle dans les signatures (correction de l'attaque par réflexion)
sfb.etiquettes-role=true
# Interpréteur Python du bouchon
sfb.python=python3

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false

# Service public de démonstration : peu de fils, corps de requête courts, arrêt propre
server.tomcat.threads.max=24
server.tomcat.max-swallow-size=4KB
server.tomcat.max-http-form-post-size=4KB
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s
